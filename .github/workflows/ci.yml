name: CareLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify & Validate OpenAPI Schema Export
        run: |
          python backend/export_openapi.py

      - name: Run Backend Integration Test Suite
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-long"
          JWT_REFRESH_SECRET_KEY: "ci-testing-refresh-jwt-secret-key-32-chars"
          ENVIRONMENT: "testing"
        run: |
          pytest backend/tests/test_api.py -v

  frontend-checks:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck Against API Types (Fail on Drift)
        run: npm run typecheck

      - name: Run Unit & Boundary Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
