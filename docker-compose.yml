services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carelens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=carelens_production_jwt_signing_key_32_characters_min
      - JWT_REFRESH_SECRET_KEY=carelens_production_jwt_refresh_key_32_characters
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./app_uploads:/app/app_uploads
      - ./app_data.sqlite3:/app/app_data.sqlite3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carelens-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
